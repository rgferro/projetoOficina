version: '3.8'

services:
  autogestao-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autogestao_oficina
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./prisma/dev.db
    volumes:
      # Persistência do banco de dados SQLite local
      - ./prisma/data:/app/prisma
